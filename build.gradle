plugins {
    id 'java'
}

group = 'org.shanguanling.serverhub'
version = '1.0'

repositories {
    mavenCentral()
}

dependencies {
    compileOnly files('libs/BungeeCord.jar')
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

tasks.jar {
    archiveBaseName.set("ServerHub")
    archiveVersion.set("")
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = "UTF-8"
}

